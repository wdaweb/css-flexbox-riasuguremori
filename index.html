      border-right: 1px solid #000;

      position: relative;
    }

    .left-top {
      width: calc(sqrt(100 * 100 + 100 * 100) * 1px);
      border: 0.5px solid #000;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: left center;
      transform: rotate(45deg);

      position: absolute;
      right: 0;
      top: 0;

      position: absolute;
      right: 0;
      top: 0;

    .right-bottom {

      position: absolute;
      left: 0;
      top: 0;
